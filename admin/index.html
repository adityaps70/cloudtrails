<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A100D">
<title>Cloud Trails Admin</title>
<link rel="icon" type="image/svg+xml" href="../images/logo-mark.svg">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form class="login-box" id="login-form">
    <img src="../images/logo-mark.svg" alt="Cloud Trails" width="130" height="52">
    <h1>Admin</h1>
    <p id="login-note">Sign in to manage bookings.</p>
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <p class="err" id="login-err"></p>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</div>

<div id="shell" class="shell" hidden>
  <aside class="side">
    <a class="side-brand" href="#/"><img src="../images/logo-mark.svg" alt="Cloud Trails" width="110" height="44"><span>Admin</span></a>
    <nav class="side-nav" id="nav">
      <a href="#/" data-nav="dash"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/></svg>Dashboard</a>
      <a href="#/bookings" data-nav="bookings"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Bookings<span class="pill-count" id="nav-pending" hidden></span></a>
      <a href="#/schedule" data-nav="schedule"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</a>
      <a href="#/calendar" data-nav="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>Availability</a>
      <a href="#/fleet" data-nav="fleet"><svg viewBox="0 0 24 24"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17h12M9 17l3-7h4l2 7M12 10 10 6H7"/></svg>Fleet &amp; prices</a>
      <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
    </nav>
    <div class="side-foot">
      <a href="../book.html" target="_blank" rel="noopener">Open booking page ↗</a>
      <button type="button" id="logout">Sign out</button>
    </div>
  </aside>
  <main class="main" id="view" tabindex="-1"></main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <p class="err" id="modal-err"></p>
    <div class="modal-actions"><button type="button" class="btn" id="modal-cancel">Cancel</button><button type="button" class="btn primary" id="modal-ok">Save</button></div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden><button type="button" aria-label="Close">×</button><img alt=""></div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="admin.js"></script>
</body>
</html>
